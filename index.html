  $("#sheet").innerHTML=`<button class="btn alt" data-a="close" style="float:right;position:relative;z-index:1">✕</button>${img(p,"dimg")}<h2 style="margin:0">${esc(p.name)}${p.promoted?`<span class="tag">${t("Promoted")}</span>`:""}</h2>
  <div class="mute">${esc(t(p.category))} · ${esc(p.address)}${avg?" · ★ "+avg:""}</div>${p.offer?`<div class="offer">${esc(p.offer)}</div>`:""}
  <div class="bento" style="margin-top:12px">${ph?`<a class="btn alt" href="tel:${esc(ph)}">${svg("phone")}${t("Call")}</a><a class="btn alt" target="_blank" rel="noopener" href="https://wa.me/${wa}">${svg("chat")}${t("WhatsApp")}</a>`:""}<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}">${svg("nav")}${t("Directions")}</a><button class="btn alt" data-a="fav" data-v="${p.id}">${svg("heart")}${t("Save")}</button></div>
  <div class="t" style="margin-top:12px"><b>${t("Menu")}</b>${(p.menu||[]).map(m=>`<div class="mi">${mimg(m.item)}<span>${esc(m.item)}</span><b>${m.price?"₹"+esc(m.price):""}</b></div>`).join("")||"<div class=mute>—</div>"}</div>
  <div class="t" style="margin-top:12px"><b>${t("Reviews")}</b>${R===null?`<p class="mute">${t("Loading...")}</p>`:R.length?R.map(r=>`<div style="margin-top:8px"><b>${esc(r.name)}</b> <span class="mute">${"★".repeat(r.rating)}</span><br>${esc(r.text)}</div>`).join(""):`<p class="mute">${t("No reviews yet.")}</p>`}
  ${S.user?`<label>${t("Write a review")}</label><select id="rs">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join("")}</select><input id="rt" maxlength="300" style="margin-top:8px"><div class="row"><button class="btn" data-a="rev" data-v="${p.id}">${t("Send")}</button></div>`:`<div class="row"><button class="btn" data-a="signin">${t("Sign in with Google")}</button></div>`}</div>`;
  $("#modal").classList.add("on");hydrate();
}
A.rev=async id=>{try{await setDoc(doc(db,"places",id,"reviews",S.user.uid),{uid:S.user.uid,name:S.user.displayName||"User",rating:+$("#rs").value,text:$("#rt").value.trim(),createdAt:Timestamp.now()});A.open(id)}catch(e){toast("Could not save review.")}};
function setLoc(l){S.loc=l;$("#locst").textContent=`✓ ${t("Location set")}: ${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}`}
function parseLoc(s){const m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/[?&](?:q|ll|query|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);return m?{lat:+m[1],lng:+m[2]}:null}
function vAdd(){
  if(!S.user){$("#app").innerHTML=`<h3>${t("Add a place")}</h3><button class="btn" data-a="signin">${t("Sign in with Google")}</button>`;return}
  const d0=new Date();d0.setHours(0,0,0,0);const left=isAdmin()?99:LIMIT-S.mine.filter(p=>p.createdAt?.toDate()>=d0).length;
  if(left<=0){$("#app").innerHTML=`<h3>${t("Daily limit reached")}</h3>`;return}
  $("#app").innerHTML=`<h3>${t("Add a place")}</h3><label>${t("Place name")}</label><input id="f_n"><label>${t("Type")}</label><select id="f_c">${CATS.map(c=>`<option value="${c}">${t(c)}</option>`).join("")}</select>
  <label>${t("Address")}</label><textarea id="f_a" rows="2"></textarea><label>${t("Phone (optional)")}</label><input id="f_p" type="tel"><label>${t("Photo link (optional)")}</label><input id="f_i" placeholder="https://...">
  <label>${t("Location")}</label><input id="f_l" placeholder="${esc(t("Paste Google Maps link or lat,lng"))}"><div class="row"><button class="btn alt" data-a="gpsf">${svg("pin")}${t("Use my location")}</button><button class="btn alt" data-a="gm">${t("Open Google Maps")}</button><button class="btn alt" data-a="pick">${t("Pick on map")}</button></div><p class="mute" id="locst"></p><p class="mute">Google Maps: long-press the spot, tap the numbers at the top to copy, then paste them above.</p>
  <label>${t("Menu, one item per line: Item - price")}</label><textarea id="f_m" rows="5" placeholder="Chicken biryani - 180"></textarea>
  <div class="row"><button class="btn" data-a="submit">${isAdmin()?t("Publish"):t("Send for approval")}</button></div>`;
  $("#f_l").oninput=e=>{const v=e.target.value,l=parseLoc(v);if(l){setLoc(l);const n=v.match(/\/maps\/place\/([^/@?]+)/);if(n&&!$("#f_n").value)$("#f_n").value=decodeURIComponent(n[1].replace(/\+/g," "))}else $("#locst").textContent=/goo\.gl/.test(v)?"Short links can't be read. Open it in Chrome and copy the long link from the address bar, or use Pick on map.":""};
  if(S.loc)setLoc(S.loc);
}
A.gpsf=()=>getPos(p=>setLoc(p));
let map,mk,tmp;
A.gm=()=>{const n=($("#f_n")?.value||"")+" "+($("#f_a")?.value||"");const c=S.loc||S.pos;open(n.trim().length>4?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(n.trim()):c?`https://www.google.com/maps/@${c.lat},${c.lng},18z`:"https://www.google.com/maps","_blank")};
function mapGo(c,z){$("#mapm").classList.add("on");setTimeout(()=>{if(!map){map=L.map("mp").setView(c?[c.lat,c.lng]:[20.6,78.9],c?z:5);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);map.on("click",e=>{tmp={lat:e.latlng.lat,lng:e.latlng.lng};mk?mk.setLatLng(e.latlng):mk=L.marker(e.latlng).addTo(map)})}else if(c)map.setView([c.lat,c.lng],z);map.invalidateSize()},60)}
A.pick=()=>{$("#ms").placeholder=t("Search area...");$("#mo").textContent=t("Confirm");const c=S.loc||S.pos;if(c)mapGo(c,18);else getPos(p=>{S.pos=p;mapGo(p,18)})};
$("#ms").onkeydown=async e=>{if(e.key!="Enter")return;try{const r=await(await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(e.target.value))).json();if(r[0])map.setView([+r[0].lat,+r[0].lon],17);else toast("Not found.")}catch(x){toast("Search failed.")}};
A.mapx=()=>$("#mapm").classList.remove("on");
A.pickok=()=>{if(!tmp)return toast(t("Tap on the map to drop a pin."));setLoc(tmp);A.mapx()};
A.submit=async()=>{
  const name=$("#f_n").value.trim(),address=$("#f_a").value.trim();
  if(name.length<3||address.length<10)return toast("Add the place name and a full address.");
  if(!S.loc)return toast("Add the location: paste a Maps link, use your location, or pick on the map.");
  const photo=$("#f_i").value.trim();if(photo&&!/^https:\/\//.test(photo))return toast("Photo link must start with https://");
  const menu=$("#f_m").value.split("\n").map(l=>l.trim()).filter(Boolean).slice(0,60).map(l=>{const i=l.lastIndexOf("-");return i>0?{item:l.slice(0,i).trim(),price:l.slice(i+1).replace(/[^\d.]/g,"")}:{item:l,price:""}});
  try{await addDoc(collection(db,"places"),{name,category:$("#f_c").value,address,phone:$("#f_p").value.trim(),photo,lat:S.loc.lat,lng:S.loc.lng,menu,offer:"",promoted:false,ownerId:S.user.uid,status:isAdmin()?"approved":"pending",createdAt:Timestamp.now()});
    S.loc=null;toast(isAdmin()?"Published.":"Sent. It will show after the admin approves it.");S.tab="me";await load()}catch(e){console.error(e);toast("Could not save. Check your Firebase rules.")}
};
function vMe(){
  const u=S.user;
  $("#app").innerHTML=u?`<div class="row" style="align-items:center">${u.photoURL?`<img style="border-radius:50%;width:64px;height:64px;object-fit:cover" src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">`:""}<div><b>${esc(u.displayName||"")}</b><div class="mute">${esc(u.email)}</div></div></div>
  <div class="row"><button class="btn alt" data-a="lang">${t("Language")}: ${S.lang=="te"?"తెలుగు":"English"}</button>${isAdmin()?`<button class="btn" data-a="tab" data-v="admin">${t("Admin panel")}${S.pending.length?` (${S.pending.length})`:""}</button>`:""}<button class="btn alt" data-a="signout">${t("Sign out")}</button></div>
  <h3>${t("My places")}</h3>${S.mine.map(p=>`<div class="t" style="margin-bottom:10px;display:flex;gap:10px;cursor:pointer" data-a="open" data-v="${p.id}">${img(p,"mimg")}<div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="mute">${p.status=="approved"?t("Live"):t("Waiting for approval")}</div></div></div>`).join("")||"—"}`
  :`<h3>${t("Profile")}</h3><button class="btn" data-a="signin">${t("Sign in with Google")}</button><div class="row"><button class="btn alt" data-a="lang">${t("Language")}: ${S.lang=="te"?"తెలుగు":"English"}</button></div>`;
}
function vAdmin(){
  if(!isAdmin())return;
  const row=(p,b)=>`<div class="t" style="margin-bottom:10px;display:flex;gap:10px">${img(p,"mimg")}<div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="mute">${esc(p.address)}</div><div class="row">${b}</div></div></div>`;
  $("#app").innerHTML=`<h3>${t("Waiting for approval")} (${S.pending.length})</h3>${S.pending.map(p=>row(p,`<button class="btn" data-a="ok" data-v="${p.id}">${t("Approve")}</button><button class="btn bad" data-a="del" data-v="${p.id}">${t("Reject")}</button><button class="btn alt" data-a="open" data-v="${p.id}">${t("Menu")}</button><a class="btn alt" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}">Map</a>`)).join("")}
  <h3>${t("Live")} (${S.places.length})</h3>${S.places.map(p=>row(p,`<button class="btn alt" data-a="promo" data-v="${p.id}">${p.promoted?t("Remove promotion"):t("Promote")}</button><button class="btn alt" data-a="offer" data-v="${p.id}">${t("Set offer")}</button><button class="btn bad" data-a="del" data-v="${p.id}">${t("Delete")}</button>`)).join("")}`;
}
A.ok=async id=>{await updateDoc(doc(db,"places",id),{status:"approved"});load()};
A.del=async id=>{if(confirm("Delete this place?")){await deleteDoc(doc(db,"places",id));load()}};
A.promo=async id=>{const p=S.places.find(x=>x.id==id);await updateDoc(doc(db,"places",id),{promoted:!p.promoted});load()};
A.offer=async id=>{const v=prompt("Offer text (empty to remove):");if(v!==null){await updateDoc(doc(db,"places",id),{offer:v.trim()});load()}};
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
